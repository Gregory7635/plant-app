<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Результат</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="fragments/navbar :: body"></div>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-success">
            <span th:text="${identification.plant.name}"></span>
        </h2>

        <hr>

        <p>
            <b>Точность:</b>
            <span class="badge bg-success"
                  th:text="${#numbers.formatDecimal(identification.probability * 100, 1, 2)} + '%'">
            </span>
        </p>

        <p>
            <b>Описание:</b><br>
            <span th:text="${identification.plant.description}"></span>
        </p>

        <a class="btn btn-outline-primary mt-3"
           th:href="${identification.plant.wikipediaUrl}"
           target="_blank">
            Открыть Wikipedia
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
